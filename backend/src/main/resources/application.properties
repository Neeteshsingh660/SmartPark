spring.application.name=smartpark
server.port=8080
server.error.include-message=always

# Database Configuration (Fail-Safe H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:smartpark_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000

# Redis Configuration (Optional)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Kafka Configuration (Disabled by default for Cloud Safety)
spring.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost:9092}
spring.kafka.consumer.group-id=smartpark-notification-group
spring.kafka.consumer.auto-offset-reset=earliest

# Email & Resend Configuration
RESEND_API_KEY=${RESEND_API_KEY:}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TPAcsJkyv1j89b}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
